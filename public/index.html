```html
<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="TanulóBarát – modern tanuló és közösségi alkalmazás"
    >

    <!-- =====================================================
         PWA / iPHONE BEÁLLÍTÁSOK
         ===================================================== -->

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="TanulóBarát"
    >

    <!-- TanulóBarát ikon -->
    <link
        rel="apple-touch-icon"
        href="/1.png"
    >

    <link
        rel="icon"
        type="image/png"
        href="/1.png"
    >

    <title>
        TanulóBarát
    </title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>


<body>


<!-- =====================================================
     BEJELENTKEZÉS / REGISZTRÁCIÓ
     ===================================================== -->

<section id="auth">

    <div class="authbox">

        <div class="logo">
            TB
        </div>


        <h1>
            TanulóBarát
        </h1>

        <p>
            Tanulj, tartsd a kapcsolatot
            és fejlődj együtt a barátaiddal.
        </p>


        <!-- TABS -->

        <div class="tabs">

            <button
                id="loginTab"
                class="active"
                type="button"
            >
                Bejelentkezés
            </button>

            <button
                id="registerTab"
                type="button"
            >
                Regisztráció
            </button>

        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
        >

            <div class="inputbox">

                <label for="loginEmail">
                    E-mail
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="pelda@email.hu"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="inputbox">

                <label for="loginPassword">
                    Jelszó
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Jelszavad"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="primary big-button"
                type="submit"
            >
                Bejelentkezés
            </button>

        </form>


        <!-- REGISTRATION -->

        <form
            id="registerForm"
            style="display:none"
        >

            <div class="inputbox">

                <label for="registerName">
                    Teljes név
                </label>

                <input
                    id="registerName"
                    type="text"
                    placeholder="Pl. Kovács Péter"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="inputbox">

                <label for="registerUsername">
                    Felhasználónév
                </label>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="pl. peter123"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="inputbox">

                <label for="registerEmail">
                    E-mail
                </label>

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="pelda@email.hu"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="inputbox">

                <label for="registerPassword">
                    Jelszó
                </label>

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Legalább 6 karakter"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="inputbox">

                <label for="registerGrade">
                    Évfolyam
                </label>

                <select
                    id="registerGrade"
                    required
                >

                    <option
                        value=""
                        selected
                        disabled
                    >
                        Válaszd ki az évfolyamod
                    </option>

                    <option value="5">
                        5. osztály
                    </option>

                    <option value="6">
                        6. osztály
                    </option>

                    <option value="7">
                        7. osztály
                    </option>

                    <option value="8">
                        8. osztály
                    </option>

                    <option value="9">
                        9. osztály
                    </option>

                    <option value="10">
                        10. osztály
                    </option>

                    <option value="11">
                        11. osztály
                    </option>

                    <option value="12">
                        12. osztály
                    </option>

                </select>

            </div>


            <button
                class="primary big-button"
                type="submit"
            >
                Fiók létrehozása
            </button>

        </form>


        <div
            id="authMessage"
            class="auth-message"
        ></div>

    </div>

</section>



<!-- =====================================================
     ALKALMAZÁS
     ===================================================== -->

<section
    id="app"
    style="display:none"
>


    <!-- FEJLÉC -->

    <header class="app-header">

        <div class="brand">

            <div class="brand-logo">
                TB
            </div>

            <span>
                TanulóBarát
            </span>

        </div>


        <div class="header-right">

            <div id="headerAvatar"></div>

            <button
                id="logout"
                type="button"
            >
                Kilépés
            </button>

        </div>

    </header>



    <!-- FŐ TARTALOM -->

    <main id="content">

    </main>



    <!-- ALSÓ NAVIGÁCIÓ -->

    <nav>

        <button
            type="button"
            data-page="home"
            class="active"
        >
            🏠
            <span>
                Főoldal
            </span>
        </button>


        <button
            type="button"
            data-page="learning"
        >
            📚
            <span>
                Tanulás
            </span>
        </button>


        <button
            type="button"
            data-page="grades"
        >
            📝
            <span>
                Jegyek
            </span>
        </button>


        <button
            type="button"
            data-page="friends"
        >
            👥
            <span>
                Barátok
            </span>
        </button>


        <button
            type="button"
            data-page="profile"
        >
            👤
            <span>
                Profil
            </span>
        </button>

    </nav>


</section>



<!-- =====================================================
     SERVICE WORKER / PWA
     ===================================================== -->

<script>

    if ("serviceWorker" in navigator) {

        window.addEventListener(
            "load",
            function () {

                navigator.serviceWorker
                    .register("/sw.js")
                    .then(function (registration) {

                        console.log(
                            "TanulóBarát PWA elindult:",
                            registration.scope
                        );

                    })
                    .catch(function (error) {

                        console.error(
                            "PWA hiba:",
                            error
                        );

                    });

            }
        );

    }

</script>



<!-- =====================================================
     TANULÓBARÁT JAVASCRIPT
     ===================================================== -->

<script src="/app.js"></script>


</body>

</html>
```
